[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "workstation-monitor"
version = "0.1.0"
description = "Five-station AIRBOT monitoring and control platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "aiosqlite>=0.20,<1",
  "asyncssh>=2.19,<3",
  "websockets>=13,<16",
  "psutil>=6,<8",
  "python-multipart>=0.0.12,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1"]

[project.scripts]
station-monitor-server = "station_monitor.server.main:run"
station-monitor-agent = "station_monitor.agent.main:run"
station-monitor-simulator = "station_monitor.simulator:run"

[tool.setuptools.packages.find]
include = ["station_monitor*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

